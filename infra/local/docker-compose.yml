# Локальный «прод» Traktor: тот же состав, что и в облаке, но на компьютере.
#
# Соответствие облачным сервисам (переезд = смена переменных, не кода):
#   postgres  → Cloud SQL Postgres 16 + PostGIS
#   redis     → Memorystore Redis (кэш, идемпотентность, лимиты)
#   minio     → Cloudflare R2 (S3-совместимое хранилище фото)
#   centrifugo→ Centrifugo на Cloud Run (realtime: ставки аукциона, чат)
#   identity/gateway/notifications → те же образы на Cloud Run
#
# Запуск: scripts\stack-up.bat   Остановка: scripts\stack-down.bat

name: traktor

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine   # PostGIS нужен для геопоиска заданий
    container_name: traktor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: traktor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traktor-local}
      POSTGRES_DB: traktor
    ports:
      - "15432:5432"          # 5432 занят другими проектами на этой машине
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traktor -d traktor"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: traktor-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Хранилище фотографий: S3-совместимое, как Cloudflare R2.
  # Код работает через S3 API, поэтому переезд на R2 — смена адреса и ключей.
  minio:
    image: minio/minio:latest
    container_name: traktor-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-traktor}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-traktor-local-secret}
    ports:
      - "19000:9000"          # S3 API
      - "19001:9001"          # веб-консоль: http://localhost:19001
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Создаёт бакет для фото при первом запуске и выходит.
  minio-init:
    image: minio/mc:latest
    container_name: traktor-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-traktor} ${S3_SECRET_KEY:-traktor-local-secret} &&
      mc mb --ignore-existing local/traktor-media &&
      mc anonymous set download local/traktor-media &&
      echo 'бакет traktor-media готов'
      "
    restart: "no"

  # Realtime: живые ставки аукциона, чат, статусы сделок (ADR-6).
  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: traktor-centrifugo
    restart: unless-stopped
    command: ["centrifugo", "--config", "/centrifugo/config.json"]
    ports:
      - "18000:8000"
    volumes:
      - ./centrifugo.json:/centrifugo/config.json:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # Раздаёт собранное веб-приложение (apps/mobile/build/web).
  # В облаке эту роль возьмёт Cloudflare Pages или R2 — код приложения тот же.
  web:
    image: nginx:alpine
    container_name: traktor-web
    restart: unless-stopped
    ports:
      - "18090:80"
    volumes:
      - ../../apps/mobile/build/web:/usr/share/nginx/html:ro
      - ./nginx-web.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  redisdata:
  miniodata:
