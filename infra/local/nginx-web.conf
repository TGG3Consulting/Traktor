# Раздача веб-приложения Traktor (Flutter web).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ссылками на задание и на исполнителя делятся в мессенджерах — это
    # основной канал сарафана. Бот WhatsApp или Telegram не выполняет
    # JavaScript и видит в index.html пустую страницу, поэтому его запросы
    # уходят на шлюз, который отдаёт те же адреса с og-тегами (ТЗ §4.2).
    # Живой человек ходит обычным путём и получает приложение.
    set $is_bot 0;
    if ($http_user_agent ~* "(facebookexternalhit|WhatsApp|Telegram|Twitterbot|vkShare|Slackbot|Discordbot|LinkedInBot|Googlebot|bingbot|YandexBot|Viber|Skype)") {
        set $is_bot 1;
    }
    location ~ ^/(jobs|users)/([0-9a-fA-F-]+)$ {
        # Переписываем путь, а не проксируем прямо отсюда: proxy_pass с
        # переменными требует отдельного резолвера, а имени host.docker.internal
        # в DNS docker нет — оно живёт в /etc/hosts.
        if ($is_bot = 1) {
            rewrite ^/(jobs|users)/(.+)$ /share/$1/$2 last;
        }
        try_files $uri /index.html;
    }

    # Страницы превью собирает шлюз: только он ходит в сервисы за данными.
    location /share/ {
        proxy_pass http://host.docker.internal:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Flutter web — одностраничное приложение: любой неизвестный путь отдаём
    # index.html, иначе прямая ссылка на /job/123 вернула бы 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ВАЖНО: Flutter собирает main.dart.js и flutter_bootstrap.js БЕЗ хэша в
    # имени — имя файла не меняется от сборки к сборке. Если их закэшировать,
    # у пользователя останется старая версия приложения, пока кэш не истечёт.
    # Поэтому точка входа и код приложения всегда запрашиваются заново.
    location ~* ^/(index\.html|flutter_bootstrap\.js|main\.dart\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # canvaskit лежит в папке с версией движка — содержимое по этому пути
    # никогда не меняется, кэшируем надолго.
    location ~* ^/canvaskit/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # assets (шрифты, AssetManifest, NOTICES) собираются БЕЗ хэша в имени и
    # меняются при добавлении ресурсов — кэшировать нельзя по той же причине,
    # что и код: пользователь застрянет на старом наборе.
    location ~* ^/assets/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
