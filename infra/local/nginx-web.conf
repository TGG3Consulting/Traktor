# Раздача веб-приложения Traktor (Flutter web).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web — одностраничное приложение: любой неизвестный путь отдаём
    # index.html, иначе прямая ссылка на /job/123 вернула бы 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ВАЖНО: Flutter собирает main.dart.js и flutter_bootstrap.js БЕЗ хэша в
    # имени — имя файла не меняется от сборки к сборке. Если их закэшировать,
    # у пользователя останется старая версия приложения, пока кэш не истечёт.
    # Поэтому точка входа и код приложения всегда запрашиваются заново.
    location ~* ^/(index\.html|flutter_bootstrap\.js|main\.dart\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # canvaskit лежит в папке с версией движка — содержимое по этому пути
    # никогда не меняется, кэшируем надолго.
    location ~* ^/canvaskit/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # assets (шрифты, AssetManifest, NOTICES) собираются БЕЗ хэша в имени и
    # меняются при добавлении ресурсов — кэшировать нельзя по той же причине,
    # что и код: пользователь застрянет на старом наборе.
    location ~* ^/assets/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
