# Раздача веб-приложения Traktor (Flutter web).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web — одностраничное приложение: любой неизвестный путь отдаём
    # index.html, иначе прямая ссылка на /job/123 вернула бы 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Собранные ресурсы с хэшем в имени можно кэшировать надолго.
    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # index.html не кэшируем, иначе пользователи останутся на старой версии.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
