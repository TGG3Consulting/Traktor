<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traktor — UI/UX прототип v1.0</title>
<style>
/* ============ TOKENS (ТЗ §1.7–1.8) ============ */
:root{
  --primary:#E8730C; --primary-press:#C96208; --primary-soft:rgba(232,115,12,.12);
  --success:#2E9E5B; --warn:#E5A400; --error:#D64545; --info:#3478C6;
  --r-card:12px; --r-btn:10px; --pad:16px;
  --st-draft:#8A919B; --st-published:#3478C6; --st-bidding:#E5A400; --st-deciding:#8B5CF6;
  --st-confirmed:#14B8A6; --st-inprogress:#E8730C; --st-acceptance:#38BDF8;
  --st-completed:#2E9E5B; --st-dispute:#D64545; --st-cancelled:#4B5563;
  font-family:Inter,-apple-system,"Segoe UI",Roboto,"Noto Sans Armenian",sans-serif;
}
.phone[data-theme="light"]{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface2:#F5F6F8; --text:#1A1D21; --text2:#6B7280;
  --border:#E7E9EC; --tabbar:#FFFFFF; --shadow:0 1px 3px rgba(26,29,33,.08);
  --skeleton:#E9EBEE; --c1:#E8730C; --c2:#3478C6; --c3:#14B8A6; --c4:#8B5CF6;
}
.phone[data-theme="dark"]{
  --bg:#1A1D21; --surface:#23272C; --surface2:#2A2F35; --text:#F3F4F6; --text2:#9CA3AF;
  --border:#33383F; --tabbar:#1F2328; --shadow:0 1px 3px rgba(0,0,0,.4);
  --skeleton:#2E333A; --c1:#DB6A0A; --c2:#3478C6; --c3:#0E9E8C; --c4:#8B5CF6;
}
*{box-sizing:border-box;margin:0;padding:0}
svg.pi{width:1.12em;height:1.12em;vertical-align:-0.16em;flex-shrink:0;display:inline-block}
body{background:#101216;color:#E5E7EB;min-height:100vh}
#app{display:flex;min-height:100vh}

/* ============ SIDEBAR (панель прототипа) ============ */
#sidebar{width:300px;flex-shrink:0;background:#16191D;border-right:1px solid #262B31;
  padding:20px 14px;overflow-y:auto;height:100vh;position:sticky;top:0}
#sidebar .logo{font-size:20px;font-weight:700;color:#fff;margin-bottom:2px}
#sidebar .logo span{color:#E8730C}
#sidebar .sub{font-size:11.5px;color:#8A919B;margin-bottom:16px;line-height:1.5}
.ctrl{margin-bottom:10px}
.ctrl label{display:block;font-size:11px;color:#8A919B;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.seg{display:flex;background:#22262C;border-radius:8px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;color:#9CA3AF;font-size:12.5px;padding:6px 4px;
  border-radius:6px;cursor:pointer;font-family:inherit}
.seg button.on{background:#E8730C;color:#fff;font-weight:600}
.grp{margin-top:16px}
.grp h4{font-size:11px;color:#8A919B;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.grp a{display:block;padding:7px 10px;border-radius:7px;color:#C6CBD2;font-size:13.5px;
  text-decoration:none;cursor:pointer;line-height:1.35}
.grp a:hover{background:#1E2227}
.grp a.on{background:#2A2216;color:#F5A055;font-weight:600}
.grp a small{color:#6B7280;font-size:11px;display:block}

/* ============ STAGE ============ */
#stage{flex:1;display:flex;flex-direction:column;align-items:center;padding:28px 20px;gap:14px}
#screen-note{max-width:420px;font-size:13px;line-height:1.55;color:#9CA3AF;text-align:center}
#screen-note b{color:#E5E7EB}

/* ============ PHONE FRAME ============ */
.phone{width:394px;height:830px;background:var(--bg);border-radius:44px;border:10px solid #000;
  overflow:hidden;position:relative;box-shadow:0 24px 70px rgba(0,0,0,.55);flex-shrink:0;
  display:flex;flex-direction:column;color:var(--text)}
.statusbar{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;font-size:13.5px;font-weight:600;color:var(--text);background:transparent;position:relative;z-index:5}
.statusbar .notch{position:absolute;left:50%;transform:translateX(-50%);top:8px;width:118px;height:28px;
  background:#000;border-radius:16px}
.scr{flex:1;overflow-y:auto;display:flex;flex-direction:column;position:relative;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr>*{flex-shrink:0}
.scr>.content{flex-shrink:1}
.scr .sticky-cta,.scr .tabbar{position:sticky;bottom:0;z-index:20;margin-top:auto}

/* ============ КОМПОНЕНТЫ UI-KIT (ТЗ §1.10) ============ */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;
  font-family:inherit;font-size:16px;font-weight:600;border-radius:var(--r-btn);
  min-height:50px;padding:0 18px;width:100%;transition:transform .06s}
.btn:active{transform:scale(.98)}
.btn{white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:disabled{background:var(--skeleton);color:var(--text2);cursor:default}
.btn-secondary{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.btn-ghost{background:transparent;color:var(--text2);min-height:44px}
.btn-destructive{background:var(--error);color:#fff}
.btn-sm{min-height:38px;font-size:14px;width:auto;padding:0 14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;font-weight:500}
.field input,.field textarea,.field select{width:100%;background:var(--surface);color:var(--text);
  border:1.5px solid var(--border);border-radius:10px;padding:13px 14px;font-size:16px;font-family:inherit}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--primary)}
.field .helper{font-size:12px;color:var(--text2);margin-top:5px}
.field .err{font-size:12px;color:var(--error);margin-top:5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 13px;border-radius:18px;font-size:13px;background:var(--surface);
  border:1px solid var(--border);color:var(--text);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600}
.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);padding:14px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;
  padding:3px 9px;border-radius:20px;color:#fff;white-space:nowrap}
.badge-soft{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;
  padding:3px 9px;border-radius:20px;white-space:nowrap}
.stars{color:#F5A623;font-size:13px;font-weight:600}
.avatar{border-radius:50%;background:linear-gradient(135deg,#E8730C,#F5A055);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.divider{height:1px;background:var(--border);margin:4px 0}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:10px 20px 26px;width:100%;max-height:78%;overflow-y:auto}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--border);margin:4px auto 14px}
.toast{position:absolute;bottom:104px;left:16px;right:16px;background:#1A1D21;color:#fff;
  padding:12px 16px;border-radius:10px;font-size:13.5px;z-index:40;display:flex;justify-content:space-between;
  align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:up .25s}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.skel{background:var(--skeleton);border-radius:8px;position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.09),transparent);
  animation:sh 1.3s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.price{font-variant-numeric:tabular-nums;font-weight:700}
.h1{font-size:24px;line-height:32px;font-weight:600}
.h2{font-size:20px;line-height:28px;font-weight:600}
.h3{font-size:17px;line-height:24px;font-weight:600}
.body{font-size:15px;line-height:22px}
.cap{font-size:13px;line-height:18px;color:var(--text2)}

/* ============ TAB BAR + FAB (ТЗ §1.9) ============ */
.tabbar{flex-shrink:0;height:82px;background:var(--tabbar);border-top:1px solid var(--border);
  display:flex;align-items:stretch;position:relative;z-index:10;padding-bottom:16px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;color:var(--text2);cursor:pointer;position:relative;font-weight:500}
.tab .ic{font-size:21px;line-height:1}
.tab.on{color:var(--primary);font-weight:600}
.tab .nbadge{position:absolute;top:8px;right:calc(50% - 20px);background:var(--error);color:#fff;
  font-size:9.5px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;
  align-items:center;justify-content:center;padding:0 4px}
.tab .dot{position:absolute;top:10px;right:calc(50% - 15px);width:8px;height:8px;border-radius:4px;background:var(--error)}
.fabwrap{flex:1;position:relative}
.fab{position:absolute;left:50%;top:-26px;transform:translateX(-50%);width:56px;height:56px;
  border-radius:28px;background:var(--primary);color:#fff;font-size:26px;display:flex;align-items:center;
  justify-content:center;box-shadow:0 4px 14px rgba(232,115,12,.45);cursor:pointer;border:4px solid var(--bg)}
.appbar{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:8px var(--pad);min-height:52px}
.appbar .back{font-size:22px;cursor:pointer;color:var(--text);width:32px}
.appbar .t{font-size:17px;font-weight:600;flex:1}
.content{flex:1;padding:4px var(--pad) 20px;display:flex;flex-direction:column;gap:12px}
.sticky-cta{flex-shrink:0;padding:12px var(--pad) 22px;background:var(--tabbar);border-top:1px solid var(--border);display:flex;gap:10px}

/* Таймер аукциона (ТЗ §1.7) */
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.amber{color:var(--warn)}
.timer.red{color:var(--error);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* Степпер визарда */
.wsteps{display:flex;gap:6px;padding:0 var(--pad);margin-bottom:4px}
.wsteps i{flex:1;height:4px;border-radius:2px;background:var(--border)}
.wsteps i.done{background:var(--primary)}

/* Плитки категорий */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:16px 12px;
  text-align:center;cursor:pointer;font-size:13.5px;font-weight:500;line-height:1.35}
.tile .ic{font-size:26px;display:block;margin-bottom:6px}
.tile.on{border-color:var(--primary);background:var(--primary-soft)}

/* Онбординг роли */
.rolecard{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:22px 18px;
  cursor:pointer;display:flex;gap:14px;align-items:center}
.rolecard:hover{border-color:var(--primary)}
.rolecard .em{font-size:34px}

/* OTP */
.otp{display:flex;gap:9px;justify-content:center}
.otp b{width:46px;height:56px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600}
.otp b.fill{border-color:var(--primary)}

/* Timeline сделки */
.tl{display:flex;flex-direction:column}
.tl .step{display:flex;gap:12px}
.tl .rail{display:flex;flex-direction:column;align-items:center;width:26px;flex-shrink:0}
.tl .dot2{width:22px;height:22px;border-radius:11px;border:2px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.tl .dot2.done{background:var(--success);border-color:var(--success);color:#fff}
.tl .dot2.cur{border-color:var(--primary);color:var(--primary);font-weight:700}
.tl .line{width:2px;flex:1;background:var(--border);min-height:20px}
.tl .line.done{background:var(--success)}
.tl .info{padding-bottom:16px;flex:1}

/* Chat */
.msg{max-width:75%;padding:9px 13px;border-radius:14px;font-size:14.5px;line-height:1.4;margin-bottom:8px}
.msg.me{background:var(--primary);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.them{background:var(--surface);border-bottom-left-radius:4px;box-shadow:var(--shadow)}
.msg .mt{font-size:10.5px;opacity:.7;text-align:right;margin-top:3px}
.sysmsg{text-align:center;font-size:12px;color:var(--text2);background:var(--surface2);
  border-radius:12px;padding:5px 12px;margin:6px auto 10px;width:fit-content}

/* CRM widgets */
.kpi{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.delta{font-size:12.5px;font-weight:600}
.delta.up{color:var(--success)} .delta.down{color:var(--error)}
.wtitle{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.legend .row{display:flex;align-items:center;gap:8px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.legend .val{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}

/* Списки-настройки */
.mrow{display:flex;align-items:center;gap:12px;padding:13px 2px;cursor:pointer;font-size:15px}
.mrow .ric{width:26px;text-align:center;font-size:17px}
.mrow .chev{margin-left:auto;color:var(--text2)}
.switch{width:44px;height:26px;border-radius:13px;background:var(--border);position:relative;cursor:pointer;flex-shrink:0;margin-left:auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:.15s}
.switch.on{background:var(--success)}
.switch.on::after{left:21px}

/* Карта-плейсхолдер */
.map{background:
  repeating-linear-gradient(0deg,transparent 0 34px,rgba(127,127,127,.13) 34px 35px),
  repeating-linear-gradient(90deg,transparent 0 34px,rgba(127,127,127,.13) 34px 35px),
  linear-gradient(135deg,#DCE8DF,#CFDFE8);border-radius:12px;position:relative;overflow:hidden}
.phone[data-theme="dark"] .map{background:
  repeating-linear-gradient(0deg,transparent 0 34px,rgba(255,255,255,.06) 34px 35px),
  repeating-linear-gradient(90deg,transparent 0 34px,rgba(255,255,255,.06) 34px 35px),
  linear-gradient(135deg,#242C28,#22303A)}
.pin{position:absolute;width:30px;height:30px;transform:translate(-50%,-100%);font-size:26px;line-height:1}
.cluster{position:absolute;transform:translate(-50%,-50%);background:var(--primary);color:#fff;font-weight:700;
  font-size:12.5px;width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.gallery{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.ph{background:linear-gradient(135deg,#8898A5,#5E6E7A);border-radius:10px;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:30px;color:rgba(255,255,255,.85)}
.empty{text-align:center;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .il{font-size:52px}
.banner{padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.45;display:flex;gap:9px;align-items:flex-start}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo" id="logoRow">🚜 Trak<span>tor</span></div>
    <div class="sub">UI/UX-прототип по ТЗ v1.0<br>Кликабельные флоу · экраны по §2–§3</div>
    <div class="ctrl"><label>Тема</label>
      <div class="seg" id="segTheme">
        <button data-v="light" class="on">Светлая</button><button data-v="dark">Тёмная</button>
      </div></div>
    <div class="ctrl"><label>Язык</label>
      <div class="seg" id="segLang">
        <button data-v="hy">Հայ</button><button data-v="ru" class="on">Рус</button><button data-v="en">Eng</button>
      </div></div>
    <div class="ctrl"><label>Роль (перестраивает таб-бар)</label>
      <div class="seg" id="segRole">
        <button data-v="client" class="on">Заказчик</button><button data-v="owner">Исполнитель</button>
      </div></div>
    <nav id="nav"></nav>
  </aside>
  <main id="stage">
    <div class="phone" data-theme="light" id="phone">
      <div class="statusbar"><span id="clock">14:32</span><div class="notch"></div><span id="sbRight" style="display:flex;gap:5px;align-items:center">📶 🔋</span></div>
      <div class="scr" id="scr"></div>
    </div>
    <div id="screen-note"></div>
  </main>
</div>

function barChart(){
  const data=[["Апр",310],["Май",420],["Июн",380],["Июл",545],["Авг",640]];
  const max=700, W=300, H=110, bw=38, gap=(W-bw*data.length)/(data.length+1);
  return `<svg viewBox="0 -14 ${W} ${H+36}" style="width:100%">
    ${data.map(([m,v],i)=>{const h=v/max*H, x=gap+(bw+gap)*i, y=H-h, last=i===data.length-1;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4"
        fill="var(--c1)" opacity="${last?1:.55}"/>
      ${(last||v===545)?`<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--text)">${v}К</text>`:''}
      <text x="${x+bw/2}" y="${H+15}" text-anchor="middle" font-size="10" fill="var(--text2)">${m}</text>`;}).join('')}
  </svg>`;
}
function sparkline(){
  const pts=[4.5,4.6,4.55,4.7,4.75,4.8]; const W=120,H=34,min=4.4,max=4.9;
  const xy=pts.map((p,i)=>`${i*(W/(pts.length-1))},${H-(p-min)/(max-min)*H}`).join(' ');
  return `<svg viewBox="-2 -4 ${W+4} ${H+8}" style="width:120px"><polyline points="${xy}" fill="none"
    stroke="var(--c3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${W}" cy="${H-(4.8-min)/(max-min)*H}" r="3.5" fill="var(--c3)" stroke="var(--surface)" stroke-width="2"/></svg>`;
}
function donut(){
  const segs=[["Земляные",60,'var(--c1)'],["Перевозка",30,'var(--c2)'],["Кран",10,'var(--c3)']];
  const R=42, C=2*Math.PI*R; let off=0;
  return `<div style="display:flex;gap:16px;align-items:center">
    <svg viewBox="0 0 110 110" style="width:112px;flex-shrink:0">
      ${segs.map(s=>{const len=s[1]/100*C, el=`<circle cx="55" cy="55" r="${R}" fill="none" stroke="${s[2]}"
        stroke-width="15" stroke-dasharray="${len-2.5} ${C-len+2.5}" stroke-dashoffset="${-off}"
        transform="rotate(-90 55 55)"/>`; off+=len; return el;}).join('')}
      <text x="55" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="var(--text)">385К</text>
      <text x="55" y="66" text-anchor="middle" font-size="9" fill="var(--text2)">за месяц</text>
    </svg>
    <div class="legend" style="flex:1">
      ${segs.map(s=>`<div class="row"><span class="sw" style="background:${s[2]}"></span>${s[0]}
        <span class="val">${s[1]}%</span></div>`).join('')}
    </div></div>`;
}

/* ================== РЕНДЕР / РОУТЕР ================== */
function go(id){
  if(!SCREENS[id]) return;
  S.screen = id; S.sheet=null;
  document.getElementById('scr').innerHTML = iconize(SCREENS[id].render());
  document.getElementById('screen-note').innerHTML = iconize(SCREENS[id].note||'');
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on', a.dataset.id===id));
  if(SCREENS[id].mount) SCREENS[id].mount();
}
function setLang(l){ S.lang=l; syncSeg(); }
function syncSeg(){
  [['segTheme','theme'],['segLang','lang'],['segRole','role']].forEach(([id,key])=>{
    document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on', b.dataset.v===S[key]));
  });
  document.getElementById('phone').dataset.theme = S.theme;
}
function toast(msg){
  const el=document.createElement('div'); el.className='toast'; el.innerHTML=iconize(msg);
  document.getElementById('scr').appendChild(el); setTimeout(()=>el.remove(),2600);
}
/* auth helpers */
function phCheck(){
  const ok = document.getElementById('phInput').value.replace(/\D/g,'').length>=8
          && document.getElementById('phAgree').checked;
  document.getElementById('phBtn').disabled = !ok;
}
function otpFill(){
  const cells=[...document.querySelectorAll('#otpBox b')]; const code='482915';
  cells.forEach((c,i)=>setTimeout(()=>{c.textContent=code[i];c.classList.add('fill');
    if(i===5) setTimeout(()=>go('auth_name'),350);},i*90));
}

/* sidebar init */
const nav=document.getElementById('nav');
nav.innerHTML = NAVGROUPS.map(([title,items])=>`<div class="grp"><h4>${title}</h4>`+
  items.map(([id,label])=>`<a data-id="${id}" onclick="go('${id}')">${label}</a>`).join('')+`</div>`).join('');
nav.innerHTML=iconize(nav.innerHTML);
['segTheme','segLang','segRole'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{
    if(e.target.dataset.v===undefined) return;
    const key={segTheme:'theme',segLang:'lang',segRole:'role'}[id];
    if(key==='role'){ setRole(e.target.dataset.v); return; }   // роль → всегда домашний экран роли (видимый результат)
    S[key]=e.target.dataset.v; syncSeg(); go(S.screen);
  });
});
document.getElementById('clock').textContent = '14:32';
document.getElementById('logoRow').innerHTML=iconize(document.getElementById('logoRow').innerHTML);
document.getElementById('sbRight').innerHTML=iconize(document.getElementById('sbRight').innerHTML);
go('splash');
setInterval(()=>{ S.timer=Math.max(0,S.timer-1);
  document.querySelectorAll('[data-live-timer]').forEach(el=>{
    const h=String(Math.floor(S.timer/3600)).padStart(2,'0'),
          m=String(Math.floor(S.timer%3600/60)).padStart(2,'0'),
          s=String(S.timer%60).padStart(2,'0');
    el.textContent=`${h}:${m}:${s}`;
  });
},1000);
</script>
