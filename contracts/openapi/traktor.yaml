openapi: 3.1.0
info:
  title: Traktor API
  version: 0.1.0
  description: >
    Единый контракт REST API Traktor (source of truth). Из него генерируются
    Dart-клиент (packages/api_client), серверные интерфейсы (Go) и документация.
    Меняется контракт → регенерируются обе стороны. Ломающие изменения ловит CI.
servers:
  - url: https://api.traktor.am/v1
    description: prod (домен — после выбора Тиграном)
  - url: https://api.stage.traktor.am/v1
    description: stage

tags:
  - name: identity
    description: Регистрация и вход (OTP через Dexatel), сессии, профиль.
  - name: notifications
    description: Push-токены устройств и уведомления (FCM за интерфейсом).
  - name: catalog
    description: Справочник категорий работ и техники с шаблонами характеристик.
  - name: orders
    description: "Задания заказчика: черновики визарда, публикация, лента, деталка."

paths:
  /auth/otp/start:
    post:
      tags: [identity]
      summary: Отправить OTP на телефон
      operationId: authOtpStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "+37491234567", description: "E.164" }
      responses:
        "200":
          description: Код отправлен (или доступен тест-режим)
          content:
            application/json:
              schema:
                type: object
                properties:
                  retryAfterSec: { type: integer, example: 60 }
                  channel: { type: string, enum: [sms, telegram], example: sms }
        "429": { $ref: "#/components/responses/RateLimited" }
        "400": { $ref: "#/components/responses/Problem" }

  /auth/otp/verify:
    post:
      tags: [identity]
      summary: Проверить код и выдать сессию
      operationId: authOtpVerify
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, example: "000000" }
      responses:
        "200":
          description: Успешный вход
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Problem" }
        "423":
          description: Слишком много неверных попыток (пауза)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /auth/refresh:
    post:
      tags: [identity]
      summary: Обновить access по refresh-токену (ротация)
      operationId: authRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        "200":
          description: Новая пара токенов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Problem" }

  /me:
    get:
      tags: [identity]
      summary: Профиль текущего пользователя
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [identity]
      summary: Обновить свой профиль (имя, фото, город, активная роль)
      operationId: updateMe
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 50 }
                city: { type: string }
                activeRole: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: Обновлённый профиль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /devices:
    post:
      tags: [notifications]
      summary: Зарегистрировать push-токен текущего устройства
      operationId: registerDevice
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceRegistration" }
      responses:
        "204": { description: Токен зарегистрирован/обновлён (идемпотентно) }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /devices/{token}:
    delete:
      tags: [notifications]
      summary: Снять регистрацию push-токена (logout / отзыв разрешения)
      operationId: unregisterDevice
      security: [{ bearerAuth: [] }]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Регистрация снята }
        "401": { $ref: "#/components/responses/Problem" }

  /categories:
    get:
      tags: [catalog]
      summary: Дерево категорий (работы и техника)
      description: >
        Открыто без входа: справочник нужен и гостю в режиме «просто посмотреть».
        Названия приходят сразу на трёх языках — переключение языка в приложении
        не требует нового запроса.
      operationId: listCategories
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [work, unit] }
          description: work — виды работ (визард задания), unit — техника (визард техники)
        - name: flat
          in: query
          schema: { type: string, enum: ["1"] }
          description: "1 — плоский список вместо дерева (для поиска по названию)"
      responses:
        "200":
          description: Категории
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/Problem" }

  /categories/{id}:
    get:
      tags: [catalog]
      summary: Одна категория
      operationId: getCategory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Категория
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "404": { $ref: "#/components/responses/Problem" }

  /jobs:
    get:
      tags: [orders]
      summary: Лента заданий (ТЗ §2.7)
      description: >
        Открыта без входа. Возвращает только задания, принимающие отклики.
        При переданных lat/lng каждая карточка получает distanceM.
      operationId: listJobs
      parameters:
        - name: lat
          in: query
          schema: { type: number, format: double }
        - name: lng
          in: query
          schema: { type: number, format: double }
        - name: radiusKm
          in: query
          schema: { type: number, format: double, example: 25 }
        - name: categoryIds
          in: query
          schema: { type: string }
          description: Идентификаторы категорий через запятую («Мои категории»)
        - name: mode
          in: query
          schema: { type: string, enum: [fixed, auction] }
        - name: q
          in: query
          schema: { type: string }
          description: Поиск по названию и описанию
        - name: sort
          in: query
          schema: { type: string, enum: [new, near, price, ending], default: new }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Задания
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Problem" }

  /jobs/my:
    get:
      tags: [orders]
      summary: Мои задания и черновики (главная заказчика)
      operationId: listMyJobs
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Задания заказчика, свежие сверху
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Problem" }

  /jobs/drafts:
    post:
      tags: [orders]
      summary: Создать черновик задания (шаг 1 визарда)
      description: >
        Черновик заводится сразу и автосохраняется после каждого шага (ТЗ §2.6),
        поэтому заказчик может выйти и вернуться, ничего не потеряв.
      operationId: createJobDraft
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobDraft" }
      responses:
        "201":
          description: Черновик создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /jobs/drafts/{id}:
    patch:
      tags: [orders]
      summary: Сохранить очередной шаг визарда
      description: >
        Переданы только изменённые поля: отсутствующее поле не трогается, а не
        обнуляется — сохранение шага 3 не стирает цену со шага 4.
      operationId: updateJobDraft
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobDraft" }
      responses:
        "200":
          description: Черновик сохранён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /jobs/{id}:
    get:
      tags: [orders]
      summary: Деталка задания (ТЗ §2.8)
      description: >
        Резервная цена аукциона отдаётся только владельцу задания.
        Просмотр засчитывается один раз на пользователя и не считается своим.
      operationId: getJob
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Задание
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/Problem" }

  /jobs/{id}/publish:
    post:
      tags: [orders]
      summary: Опубликовать задание (шаг 5 визарда)
      description: >
        Сервер проверяет полноту и сам считает время финиша аукциона.
        При нехватке данных возвращает 422 со списком полей.
      operationId: publishJob
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Опубликовано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422":
          description: Не хватает данных — поля перечислены в fields
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ValidationProblem" }

  /jobs/{id}/cancel:
    post:
      tags: [orders]
      summary: Отменить задание
      operationId: cancelJob
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Отменено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /jobs/{id}/offers:
    post:
      tags: [orders]
      summary: Откликнуться на задание (ТЗ §2.10)
      description: >
        kind=accept — согласие с ценой задания (сервер подставляет свою цену),
        kind=counter — встречное предложение. Повторный отклик того же
        исполнителя обновляет предложение, а не создаёт второе.
      operationId: makeOffer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferInput" }
      responses:
        "201":
          description: Предложение отправлено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422":
          description: Цена или комментарий не прошли проверку
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ValidationProblem" }
    get:
      tags: [orders]
      summary: Отклики по заданию (только владелец задания)
      operationId: listJobOffers
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Предложения
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Offer" }
        "403": { $ref: "#/components/responses/Problem" }

  /jobs/{id}/offers/my:
    get:
      tags: [orders]
      summary: Своё предложение по заданию
      description: "offer=null — исполнитель ещё не откликался."
      operationId: myOfferForJob
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Предложение или null
          content:
            application/json:
              schema:
                type: object
                properties:
                  offer:
                    oneOf:
                      - $ref: "#/components/schemas/Offer"
                      - type: "null"

  /offers/my:
    get:
      tags: [orders]
      summary: Мои предложения (панель исполнителя)
      operationId: myOffers
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Предложения
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Offer" }

  /offers/{offerId}/withdraw:
    post:
      tags: [orders]
      summary: Снять своё предложение
      operationId: withdrawOffer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Предложение снято
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /offers/{offerId}/accept:
    post:
      tags: [orders]
      summary: Выбрать исполнителя
      description: >
        Задание переходит в deal_pending, остальные предложения отклоняются
        автоматически. Если был раунд встречной цены, работает она.
      operationId: acceptOffer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Исполнитель выбран
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /offers/{offerId}/decline:
    post:
      tags: [orders]
      summary: Отклонить предложение
      operationId: declineOffer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: "необязательная причина для исполнителя" }
      responses:
        "200":
          description: Отклонено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "403": { $ref: "#/components/responses/Problem" }

  /offers/{offerId}/counter:
    post:
      tags: [orders]
      summary: Встречная цена заказчика (один раунд)
      operationId: counterOffer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price]
              properties:
                price: { type: integer, format: int64 }
      responses:
        "200":
          description: Встречная цена отправлена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { description: "Раунд торга уже использован", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /jobs/{id}/deal:
    post:
      tags: [orders]
      summary: Подтвердить выбор и открыть сделку (ТЗ §2.11)
      description: >
        Отдельный шаг после выбора исполнителя: с этого момента цена
        зафиксирована. Повторный вызов возвращает ту же сделку.
      operationId: confirmDeal
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Сделка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deal" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      tags: [orders]
      summary: Сделка по заданию
      description: "deal=null — сделки ещё нет."
      operationId: dealByJob
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Сделка или null
          content:
            application/json:
              schema:
                type: object
                properties:
                  deal:
                    oneOf:
                      - $ref: "#/components/schemas/Deal"
                      - type: "null"

  /deals/my:
    get:
      tags: [orders]
      summary: Мои сделки в обеих ролях
      operationId: myDeals
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Сделки
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Deal" }

  /deals/{dealId}:
    get:
      tags: [orders]
      summary: Одна сделка (только участники)
      operationId: getDeal
      security: [{ bearerAuth: [] }]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Сделка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deal" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /deals/{dealId}/step:
    post:
      tags: [orders]
      summary: Следующий шаг работы
      description: >
        Кто вправе сделать шаг, решает сервер: выехал/начал/завершил — исполнитель,
        приёмка — заказчик. Перепрыгнуть шаг нельзя.
      operationId: advanceDeal
      security: [{ bearerAuth: [] }]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [on_the_way, in_progress, work_done, completed, disputed]
                note: { type: string }
      responses:
        "200":
          description: Сделка после шага
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deal" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /deals/{dealId}/cancel:
    post:
      tags: [orders]
      summary: Отменить сделку (причина обязательна)
      operationId: cancelDeal
      security: [{ bearerAuth: [] }]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Сделка отменена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deal" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422":
          description: Причина не указана
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ValidationProblem" }

  /jobs/{id}/bids:
    post:
      tags: [orders]
      summary: Поставить ставку в обратном аукционе (ТЗ §2.9)
      description: >
        Каждая следующая ставка ниже текущей лучшей и не ниже трети стартовой
        цены. Ставка в последние 5 минут продлевает торг на 10 минут.
      operationId: placeBid
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price]
              properties:
                price: { type: integer, format: int64 }
                comment: { type: string }
                unitId: { type: string, format: uuid, nullable: true }
      responses:
        "201":
          description: Ставка принята
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bid" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422":
          description: Цена не проходит правила торга
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ValidationProblem" }
    get:
      tags: [orders]
      summary: Лента торга (анонимная)
      description: >
        Открыта всем, кто видит задание. Имена участников не раскрываются до
        конца аукциона — только цена, место в списке и признак «моя ставка».
      operationId: listJobBids
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Ставки
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Bid" }

  /jobs/{id}/bids/my:
    get:
      tags: [orders]
      summary: Своя ставка по заданию
      operationId: myBidForJob
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Ставка или null
          content:
            application/json:
              schema:
                type: object
                properties:
                  bid:
                    oneOf:
                      - $ref: "#/components/schemas/Bid"
                      - type: "null"

  /jobs/{id}/bids/decline-all:
    post:
      tags: [orders]
      summary: Отказаться от всех ставок (без штрафа)
      operationId: declineAllBids
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Задание закрыто
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /jobs/{id}/auction/finish:
    post:
      tags: [orders]
      summary: Подвести итоги торга
      description: >
        Обычно вызывается фоновым обработчиком по времени финиша. Считает
        скоринг (0.6 цена + 0.25 рейтинг + 0.15 близость), помечает лучшую
        ставку и открывает окно решения заказчика.
      operationId: finishAuction
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Задание после подведения итогов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }

  /bids/my:
    get:
      tags: [orders]
      summary: Мои ставки
      operationId: myBids
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Ставки
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Bid" }

  /bids/{bidId}/withdraw:
    post:
      tags: [orders]
      summary: Снять свою ставку (не позднее чем за 2 часа до финиша)
      operationId: withdrawBid
      security: [{ bearerAuth: [] }]
      parameters:
        - name: bidId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Ставка снята
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bid" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /bids/{bidId}/accept:
    post:
      tags: [orders]
      summary: Выбрать победителя аукциона
      operationId: acceptBid
      security: [{ bearerAuth: [] }]
      parameters:
        - name: bidId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Ставка признана победившей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bid" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: Гарантия «двойной тап ≠ две операции» (ТЗ §4.3).
  responses:
    Problem:
      description: Ошибка (RFC 9457 problem+json) с человекочитаемым detail для тоста
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Превышен лимит запросов
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Bid:
      type: object
      required: [id, price, status]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        price: { type: integer, format: int64 }
        currency: { type: string, default: AMD }
        comment: { type: string }
        status:
          type: string
          enum: [active, withdrawn, outbid, won, lost, expired]
        rank: { type: integer, description: "место по цене, 1 — лучшая" }
        mine: { type: boolean, description: "это ставка запрашивающего" }
        score: { type: number, description: "оценка скоринга, появляется после финиша" }
        createdAt: { type: string, format: date-time }
    DealEvent:
      type: object
      required: [status, at]
      properties:
        status: { type: string }
        at: { type: string, format: date-time }
        byId: { type: string, format: uuid }
        note: { type: string }
    Deal:
      type: object
      required: [id, jobId, clientId, ownerId, price, status]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        offerId: { type: string, format: uuid, nullable: true }
        clientId: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        price: { type: integer, format: int64, description: "зафиксирована при создании сделки" }
        currency: { type: string, default: AMD }
        status:
          type: string
          enum: [confirmed, on_the_way, in_progress, work_done, completed, disputed, cancelled]
        timeline:
          type: array
          items: { $ref: "#/components/schemas/DealEvent" }
        acceptanceDeadline:
          type: string
          format: date-time
          nullable: true
          description: "48 часов на приёмку, дальше автоприёмка"
        cancelReason: { type: string }
        cancelledBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
    OfferInput:
      type: object
      required: [kind, price]
      properties:
        kind:
          type: string
          enum: [accept, counter]
          description: accept — согласен с ценой задания, counter — своя цена
        price: { type: integer, format: int64 }
        comment: { type: string, maxLength: 200 }
        eta: { type: string, description: "когда сможет приступить, свободный текст" }
        unitId: { type: string, format: uuid, nullable: true }
    Offer:
      type: object
      required: [id, jobId, ownerId, kind, price, status]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        kind: { type: string, enum: [accept, counter] }
        price: { type: integer, format: int64 }
        currency: { type: string, default: AMD }
        comment: { type: string }
        eta: { type: string }
        unitId: { type: string, format: uuid, nullable: true }
        status:
          type: string
          enum: [active, withdrawn, declined, accepted, counter_offered]
        declineReason: { type: string }
        clientCounterPrice: { type: integer, format: int64, nullable: true }
        clientCounterAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Category:
      type: object
      required: [id, kind, slug, name, icon, specTemplate]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: string, format: uuid, nullable: true }
        kind: { type: string, enum: [work, unit] }
        slug: { type: string, example: work-earth }
        name: { $ref: "#/components/schemas/LocalizedName" }
        icon: { type: string, description: "Имя иконки Phosphor из design_system (эмодзи запрещены)" }
        specTemplate:
          type: array
          items: { $ref: "#/components/schemas/SpecField" }
        sortOrder: { type: integer }
        children:
          type: array
          items: { $ref: "#/components/schemas/Category" }
    LocalizedName:
      type: object
      required: [hy, ru, en]
      properties:
        hy: { type: string }
        ru: { type: string }
        en: { type: string }
    SpecField:
      type: object
      required: [key, type]
      description: Поле характеристик — из него клиент строит поле формы.
      properties:
        key: { type: string, example: bucket }
        type: { type: string, enum: [number, text, select, bool] }
        unit: { type: string, example: "м³" }
        min: { type: number }
        max: { type: number }
        options:
          type: array
          items: { type: string }
        label_hy: { type: string }
        label_ru: { type: string }
        label_en: { type: string }
        required: { type: boolean }
    Geo:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double, example: 40.1872 }
        lng: { type: number, format: double, example: 44.5152 }
    Auction:
      type: object
      properties:
        durationH: { type: integer, example: 24, description: "1 час … 7 суток" }
        endsAt: { type: string, format: date-time, description: "Считает сервер при публикации" }
        reserveAmount: { type: integer, format: int64, nullable: true, description: "Минимальная цена. Видна только заказчику" }
        autoExtend: { type: boolean, default: true, description: "+10 мин при ставке в последние 5 минут" }
        decisionWindowH: { type: integer, default: 12 }
    JobStatus:
      type: string
      enum: [draft, published, collecting_offers, bidding, deal_pending, deciding,
             confirmed, in_progress, work_done, completed, disputed, cancelled,
             declined_all, expired, expired_no_bids]
    JobDraft:
      type: object
      description: Поля визарда. Отсутствующее поле не изменяется.
      properties:
        orderType: { type: string, enum: [job, rental, transport, workers] }
        categoryId: { type: string, format: uuid, nullable: true }
        openToAny: { type: boolean, description: "«Опишу задачу — пусть исполнители предложат технику»" }
        title: { type: string, maxLength: 80 }
        description: { type: string, minLength: 20 }
        params:
          type: object
          additionalProperties: true
          description: Значения по specTemplate категории
        photos:
          type: array
          maxItems: 6
          items: { type: string, format: uri }
        geo: { $ref: "#/components/schemas/Geo" }
        address: { type: string }
        access: { type: string, enum: ["yes", "no", "unknown"] }
        dateMode: { type: string, enum: [asap, range, exact] }
        dateStart: { type: string, format: date-time }
        dateEnd: { type: string, format: date-time }
        budgetAmount: { type: integer, format: int64, example: 120000 }
        currency: { type: string, default: AMD }
        mode: { type: string, enum: [fixed, auction] }
        auction: { $ref: "#/components/schemas/Auction" }
        workersCount: { type: integer, minimum: 0, description: "Разнорабочие в дополнение к технике (§5.5)" }
        draftStep: { type: integer, minimum: 1, maximum: 5 }
    Job:
      allOf:
        - $ref: "#/components/schemas/JobDraft"
        - type: object
          required: [id, clientId, status, currency, mode]
          properties:
            id: { type: string, format: uuid }
            clientId: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/JobStatus" }
            viewsCount: { type: integer }
            offersCount: { type: integer }
            winnerBidId: { type: string, format: uuid, nullable: true }
            distanceM: { type: number, format: double, nullable: true, description: "Только в ленте, при переданных lat/lng" }
            publishedAt: { type: string, format: date-time, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            fields:
              type: object
              additionalProperties: { type: string }
              description: "поле → что именно не так; экран подсвечивает их"
    Role:
      type: string
      enum: [client, owner]
    DeviceRegistration:
      type: object
      required: [token, platform]
      properties:
        token: { type: string, description: "Регистрационный токен FCM устройства" }
        platform:
          type: string
          enum: [android, ios, web]
        locale:
          type: string
          enum: [hy, ru, en]
          description: "Язык для текста пуша"
        appVersion: { type: string }
    Session:
      type: object
      required: [accessToken, refreshToken, expiresInSec, user]
      properties:
        accessToken: { type: string, description: "JWT ES256, 15 мин" }
        refreshToken: { type: string, description: "rotating, 30 дней" }
        expiresInSec: { type: integer, example: 900 }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      required: [id, phone, roles, activeRole]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string, description: "виден только владельцу; другим — до сделки скрыт" }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
        city: { type: string, nullable: true }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        activeRole: { $ref: "#/components/schemas/Role" }
        rating: { type: number, example: 4.8 }
        ratingCount: { type: integer, example: 36 }
        verified: { type: boolean }
        createdAt: { type: string, format: date-time }
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: "человекочитаемо, годится в тост" }
