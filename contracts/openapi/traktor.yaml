openapi: 3.1.0
info:
  title: Traktor API
  version: 0.1.0
  description: >
    Единый контракт REST API Traktor (source of truth). Из него генерируются
    Dart-клиент (packages/api_client), серверные интерфейсы (Go) и документация.
    Меняется контракт → регенерируются обе стороны. Ломающие изменения ловит CI.
servers:
  - url: https://api.traktor.am/v1
    description: prod (домен — после выбора Тиграном)
  - url: https://api.stage.traktor.am/v1
    description: stage

tags:
  - name: identity
    description: Регистрация и вход (OTP через Dexatel), сессии, профиль.
  - name: notifications
    description: Push-токены устройств и уведомления (FCM за интерфейсом).
  - name: catalog
    description: Справочник категорий работ и техники с шаблонами характеристик.
  - name: orders
    description: "Задания заказчика: черновики визарда, публикация, лента, деталка."

paths:
  /auth/otp/start:
    post:
      tags: [identity]
      summary: Отправить OTP на телефон
      operationId: authOtpStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "+37491234567", description: "E.164" }
      responses:
        "200":
          description: Код отправлен (или доступен тест-режим)
          content:
            application/json:
              schema:
                type: object
                properties:
                  retryAfterSec: { type: integer, example: 60 }
                  channel: { type: string, enum: [sms, telegram], example: sms }
        "429": { $ref: "#/components/responses/RateLimited" }
        "400": { $ref: "#/components/responses/Problem" }

  /auth/otp/verify:
    post:
      tags: [identity]
      summary: Проверить код и выдать сессию
      operationId: authOtpVerify
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, example: "000000" }
      responses:
        "200":
          description: Успешный вход
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Problem" }
        "423":
          description: Слишком много неверных попыток (пауза)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /auth/refresh:
    post:
      tags: [identity]
      summary: Обновить access по refresh-токену (ротация)
      operationId: authRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        "200":
          description: Новая пара токенов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Problem" }

  /me:
    get:
      tags: [identity]
      summary: Профиль текущего пользователя
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [identity]
      summary: Обновить свой профиль (имя, фото, город, активная роль)
      operationId: updateMe
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 50 }
                city: { type: string }
                activeRole: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: Обновлённый профиль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /devices:
    post:
      tags: [notifications]
      summary: Зарегистрировать push-токен текущего устройства
      operationId: registerDevice
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceRegistration" }
      responses:
        "204": { description: Токен зарегистрирован/обновлён (идемпотентно) }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /devices/{token}:
    delete:
      tags: [notifications]
      summary: Снять регистрацию push-токена (logout / отзыв разрешения)
      operationId: unregisterDevice
      security: [{ bearerAuth: [] }]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Регистрация снята }
        "401": { $ref: "#/components/responses/Problem" }

  /categories:
    get:
      tags: [catalog]
      summary: Дерево категорий (работы и техника)
      description: >
        Открыто без входа: справочник нужен и гостю в режиме «просто посмотреть».
        Названия приходят сразу на трёх языках — переключение языка в приложении
        не требует нового запроса.
      operationId: listCategories
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [work, unit] }
          description: work — виды работ (визард задания), unit — техника (визард техники)
        - name: flat
          in: query
          schema: { type: string, enum: ["1"] }
          description: "1 — плоский список вместо дерева (для поиска по названию)"
      responses:
        "200":
          description: Категории
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/Problem" }

  /categories/{id}:
    get:
      tags: [catalog]
      summary: Одна категория
      operationId: getCategory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Категория
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "404": { $ref: "#/components/responses/Problem" }

  /jobs:
    get:
      tags: [orders]
      summary: Лента заданий (ТЗ §2.7)
      description: >
        Открыта без входа. Возвращает только задания, принимающие отклики.
        При переданных lat/lng каждая карточка получает distanceM.
      operationId: listJobs
      parameters:
        - name: lat
          in: query
          schema: { type: number, format: double }
        - name: lng
          in: query
          schema: { type: number, format: double }
        - name: radiusKm
          in: query
          schema: { type: number, format: double, example: 25 }
        - name: categoryIds
          in: query
          schema: { type: string }
          description: Идентификаторы категорий через запятую («Мои категории»)
        - name: mode
          in: query
          schema: { type: string, enum: [fixed, auction] }
        - name: q
          in: query
          schema: { type: string }
          description: Поиск по названию и описанию
        - name: sort
          in: query
          schema: { type: string, enum: [new, near, price, ending], default: new }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Задания
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Problem" }

  /jobs/my:
    get:
      tags: [orders]
      summary: Мои задания и черновики (главная заказчика)
      operationId: listMyJobs
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Задания заказчика, свежие сверху
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Problem" }

  /jobs/drafts:
    post:
      tags: [orders]
      summary: Создать черновик задания (шаг 1 визарда)
      description: >
        Черновик заводится сразу и автосохраняется после каждого шага (ТЗ §2.6),
        поэтому заказчик может выйти и вернуться, ничего не потеряв.
      operationId: createJobDraft
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobDraft" }
      responses:
        "201":
          description: Черновик создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /jobs/drafts/{id}:
    patch:
      tags: [orders]
      summary: Сохранить очередной шаг визарда
      description: >
        Переданы только изменённые поля: отсутствующее поле не трогается, а не
        обнуляется — сохранение шага 3 не стирает цену со шага 4.
      operationId: updateJobDraft
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobDraft" }
      responses:
        "200":
          description: Черновик сохранён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /jobs/{id}:
    get:
      tags: [orders]
      summary: Деталка задания (ТЗ §2.8)
      description: >
        Резервная цена аукциона отдаётся только владельцу задания.
        Просмотр засчитывается один раз на пользователя и не считается своим.
      operationId: getJob
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Задание
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/Problem" }

  /jobs/{id}/publish:
    post:
      tags: [orders]
      summary: Опубликовать задание (шаг 5 визарда)
      description: >
        Сервер проверяет полноту и сам считает время финиша аукциона.
        При нехватке данных возвращает 422 со списком полей.
      operationId: publishJob
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Опубликовано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422":
          description: Не хватает данных — поля перечислены в fields
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ValidationProblem" }

  /jobs/{id}/cancel:
    post:
      tags: [orders]
      summary: Отменить задание
      operationId: cancelJob
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Отменено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /jobs/{id}/offers:
    post:
      tags: [orders]
      summary: Откликнуться на задание (ТЗ §2.10)
      description: >
        kind=accept — согласие с ценой задания (сервер подставляет свою цену),
        kind=counter — встречное предложение. Повторный отклик того же
        исполнителя обновляет предложение, а не создаёт второе.
      operationId: makeOffer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferInput" }
      responses:
        "201":
          description: Предложение отправлено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422":
          description: Цена или комментарий не прошли проверку
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ValidationProblem" }
    get:
      tags: [orders]
      summary: Отклики по заданию (только владелец задания)
      operationId: listJobOffers
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Предложения
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Offer" }
        "403": { $ref: "#/components/responses/Problem" }

  /jobs/{id}/offers/my:
    get:
      tags: [orders]
      summary: Своё предложение по заданию
      description: "offer=null — исполнитель ещё не откликался."
      operationId: myOfferForJob
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Предложение или null
          content:
            application/json:
              schema:
                type: object
                properties:
                  offer:
                    oneOf:
                      - $ref: "#/components/schemas/Offer"
                      - type: "null"

  /offers/my:
    get:
      tags: [orders]
      summary: Мои предложения (панель исполнителя)
      operationId: myOffers
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Предложения
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Offer" }

  /offers/{offerId}/withdraw:
    post:
      tags: [orders]
      summary: Снять своё предложение
      operationId: withdrawOffer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Предложение снято
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /offers/{offerId}/accept:
    post:
      tags: [orders]
      summary: Выбрать исполнителя
      description: >
        Задание переходит в deal_pending, остальные предложения отклоняются
        автоматически. Если был раунд встречной цены, работает она.
      operationId: acceptOffer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Исполнитель выбран
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /offers/{offerId}/decline:
    post:
      tags: [orders]
      summary: Отклонить предложение
      operationId: declineOffer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: "необязательная причина для исполнителя" }
      responses:
        "200":
          description: Отклонено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "403": { $ref: "#/components/responses/Problem" }

  /offers/{offerId}/counter:
    post:
      tags: [orders]
      summary: Встречная цена заказчика (один раунд)
      operationId: counterOffer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price]
              properties:
                price: { type: integer, format: int64 }
      responses:
        "200":
          description: Встречная цена отправлена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { description: "Раунд торга уже использован", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /jobs/{id}/deal:
    post:
      tags: [orders]
      summary: Подтвердить выбор и открыть сделку (ТЗ §2.11)
      description: >
        Отдельный шаг после выбора исполнителя: с этого момента цена
        зафиксирована. Повторный вызов возвращает ту же сделку.
      operationId: confirmDeal
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Сделка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deal" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      tags: [orders]
      summary: Сделка по заданию
      description: "deal=null — сделки ещё нет."
      operationId: dealByJob
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Сделка или null
          content:
            application/json:
              schema:
                type: object
                properties:
                  deal:
                    oneOf:
                      - $ref: "#/components/schemas/Deal"
                      - type: "null"

  /deals/my:
    get:
      tags: [orders]
      summary: Мои сделки в обеих ролях
      operationId: myDeals
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Сделки
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Deal" }

  /deals/{dealId}:
    get:
      tags: [orders]
      summary: Одна сделка (только участники)
      operationId: getDeal
      security: [{ bearerAuth: [] }]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Сделка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deal" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /deals/{dealId}/step:
    post:
      tags: [orders]
      summary: Следующий шаг работы
      description: >
        Кто вправе сделать шаг, решает сервер: выехал/начал/завершил — исполнитель,
        приёмка — заказчик. Перепрыгнуть шаг нельзя.
      operationId: advanceDeal
      security: [{ bearerAuth: [] }]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [on_the_way, in_progress, work_done, completed, disputed]
                note: { type: string }
      responses:
        "200":
          description: Сделка после шага
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deal" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /deals/{dealId}/cancel:
    post:
      tags: [orders]
      summary: Отменить сделку (причина обязательна)
      operationId: cancelDeal
      security: [{ bearerAuth: [] }]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Сделка отменена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deal" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422":
          description: Причина не указана
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ValidationProblem" }

  /jobs/{id}/bids:
    post:
      tags: [orders]
      summary: Поставить ставку в обратном аукционе (ТЗ §2.9)
      description: >
        Каждая следующая ставка ниже текущей лучшей и не ниже трети стартовой
        цены. Ставка в последние 5 минут продлевает торг на 10 минут.
      operationId: placeBid
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price]
              properties:
                price: { type: integer, format: int64 }
                comment: { type: string }
                unitId: { type: string, format: uuid, nullable: true }
      responses:
        "201":
          description: Ставка принята
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bid" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422":
          description: Цена не проходит правила торга
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ValidationProblem" }
    get:
      tags: [orders]
      summary: Лента торга (анонимная)
      description: >
        Открыта всем, кто видит задание. Имена участников не раскрываются до
        конца аукциона — только цена, место в списке и признак «моя ставка».
      operationId: listJobBids
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Ставки
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Bid" }

  /jobs/{id}/bids/my:
    get:
      tags: [orders]
      summary: Своя ставка по заданию
      operationId: myBidForJob
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Ставка или null
          content:
            application/json:
              schema:
                type: object
                properties:
                  bid:
                    oneOf:
                      - $ref: "#/components/schemas/Bid"
                      - type: "null"

  /jobs/{id}/bids/decline-all:
    post:
      tags: [orders]
      summary: Отказаться от всех ставок (без штрафа)
      operationId: declineAllBids
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Задание закрыто
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /jobs/{id}/auction/finish:
    post:
      tags: [orders]
      summary: Подвести итоги торга
      description: >
        Обычно вызывается фоновым обработчиком по времени финиша. Считает
        скоринг (0.6 цена + 0.25 рейтинг + 0.15 близость), помечает лучшую
        ставку и открывает окно решения заказчика.
      operationId: finishAuction
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Задание после подведения итогов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }

  /bids/my:
    get:
      tags: [orders]
      summary: Мои ставки
      operationId: myBids
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Ставки
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Bid" }

  /bids/{bidId}/withdraw:
    post:
      tags: [orders]
      summary: Снять свою ставку (не позднее чем за 2 часа до финиша)
      operationId: withdrawBid
      security: [{ bearerAuth: [] }]
      parameters:
        - name: bidId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Ставка снята
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bid" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /bids/{bidId}/accept:
    post:
      tags: [orders]
      summary: Выбрать победителя аукциона
      operationId: acceptBid
      security: [{ bearerAuth: [] }]
      parameters:
        - name: bidId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Ставка признана победившей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bid" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /jobs/{id}/chat:
    post:
      tags: [orders]
      summary: Открыть переписку по заданию (ТЗ §2.12)
      description: >
        Один чат на пару «задание + исполнитель»: повторный вызов возвращает
        существующую ветку, а не создаёт вторую. Заказчик указывает ownerId,
        исполнитель поле не заполняет — второй стороной всегда заказчик.
      operationId: openChat
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ownerId: { type: string, format: uuid }
      responses:
        "200":
          description: Переписка открыта
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "403": { $ref: "#/components/responses/Problem" }
        "409":
          description: Задание закрыто — переписки по нему нет
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /chats:
    get:
      tags: [orders]
      summary: Мои переписки
      operationId: myChats
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Список, свежие сверху
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Chat" }

  /chats/{chatId}:
    get:
      tags: [orders]
      summary: Карточка переписки
      operationId: getChat
      security: [{ bearerAuth: [] }]
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Переписка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /chats/{chatId}/messages:
    get:
      tags: [orders]
      summary: История переписки (открытие считается прочтением)
      operationId: chatMessages
      security: [{ bearerAuth: [] }]
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Сообщения по возрастанию времени
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [orders]
      summary: Отправить сообщение
      description: >
        До подтверждения сделки телефоны, ники мессенджеров и почта в тексте
        заменяются точками (ТЗ §2.10). Ответ содержит contactsMasked — по нему
        клиент показывает отправителю мягкое предупреждение вместо блокировки.
      operationId: sendMessage
      security: [{ bearerAuth: [] }]
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Сообщение отправлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: "#/components/schemas/Message" }
                  contactsMasked:
                    type: boolean
                    description: контакты в тексте были скрыты
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /deals/{dealId}/review:
    get:
      tags: [orders]
      summary: Что показать на экране оценки (ТЗ §2.13)
      description: >
        Роль автора в этой сделке, допустимые отметки для этой роли, имя второй
        стороны и уже поставленная оценка, если она есть.
      operationId: reviewForm
      security: [{ bearerAuth: [] }]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Форма оценки
          content:
            application/json:
              schema:
                type: object
                properties:
                  dealId: { type: string, format: uuid }
                  authorRole: { type: string, enum: [client, owner] }
                  allowedTags:
                    type: array
                    items: { type: string }
                  canReview:
                    type: boolean
                    description: сделка завершена и оценка ещё не поставлена
                  targetName: { type: string }
                  review: { $ref: "#/components/schemas/Review" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [orders]
      summary: Оставить оценку после завершения сделки
      description: >
        Звёзды обязательны, отметки и текст — нет. Отзыв публикуется не сразу:
        он открывается вместе с отзывом второй стороны либо через неделю
        (анти-месть). Поле issue — необязательный ответ «что пошло не так» при
        оценке ниже трёх звёзд, публично не показывается.
      operationId: leaveReview
      security: [{ bearerAuth: [] }]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars: { type: integer, minimum: 1, maximum: 5 }
                tags:
                  type: array
                  items: { type: string }
                text: { type: string, maxLength: 500 }
                issue: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Оценка принята
          content:
            application/json:
              schema:
                type: object
                properties:
                  review: { $ref: "#/components/schemas/Review" }
                  published:
                    type: boolean
                    description: отзыв уже виден остальным
                  asksWhatWentWrong:
                    type: boolean
                    description: стоит спросить, что пошло не так
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /reviews/users/{userId}:
    get:
      tags: [orders]
      summary: Отзывы о человеке и его рейтинг
      description: >
        Только опубликованные отзывы. Рейтинг — среднее за последние 12 месяцев
        (свежая работа важнее старых промахов, ТЗ §2.13).
      operationId: userReviews
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Карточка отзывов
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Review" }
                  rating: { type: number, example: 4.8 }
                  count: { type: integer, example: 36 }

  /reviews/{reviewId}/reply:
    post:
      tags: [orders]
      summary: Публичный ответ на отзыв о себе (один раз)
      operationId: replyToReview
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Ответ сохранён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /notifications:
    get:
      tags: [notifications]
      summary: Центр уведомлений (ТЗ §2.14)
      description: >
        Лента событий и счётчик непрочитанного. Push доходит не всегда —
        телефон выключен, разрешение не выдано, баннер смахнули; лента остаётся
        надёжным каналом. Хранение 90 дней.
      operationId: notificationsFeed
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 30 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Лента, свежие сверху
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AppNotification" }
                  unread: { type: integer }

  /notifications/read:
    post:
      tags: [notifications]
      summary: Отметить уведомления прочитанными
      description: Пустой список идентификаторов — «Прочитать все».
      operationId: markNotificationsRead
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Отмечено
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /notifications/settings:
    get:
      tags: [notifications]
      summary: Настройки уведомлений (ТЗ §2.14)
      operationId: notificationPrefs
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Текущие настройки (по умолчанию, если не менялись)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPrefs" }
    put:
      tags: [notifications]
      summary: Изменить настройки
      description: >
        Приходят только те поля, что переключили. Выключенная группа глушит
        push, но событие всё равно попадает в центр уведомлений. Тихие часы
        действуют на некритичное; «перебили ставку» проходит ночью, если
        человек сам это разрешил.
      operationId: saveNotificationPrefs
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPrefs" }
      responses:
        "200":
          description: Сохранённые настройки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPrefs" }

  /equipment/my:
    get:
      tags: [catalog]
      summary: Моя техника (ТЗ §2.5)
      operationId: myEquipment
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Список машин исполнителя, свежие сверху
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Equipment" }

  /equipment/drafts:
    post:
      tags: [catalog]
      summary: Начать визард техники
      operationId: createEquipmentDraft
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                categoryId: { type: string, format: uuid }
      responses:
        "201":
          description: Черновик создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipment" }

  /equipment/{id}:
    get:
      tags: [catalog]
      summary: Карточка техники
      operationId: getEquipment
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Карточка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipment" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [catalog]
      summary: Шаг визарда или правка карточки
      description: >
        Приходят только изменённые поля. Пока карточка на проверке, правки
        отклоняются: модерация смотрит на то, что было отправлено.
      operationId: patchEquipment
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Equipment" }
      responses:
        "200":
          description: Сохранено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipment" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /equipment/{id}/submit:
    post:
      tags: [catalog]
      summary: Опубликовать карточку техники
      description: >
        С документами карточка уходит на проверку (≤24 ч), без них публикуется
        сразу как «Без проверки»: работать можно, но в скоринге ниже.
      operationId: submitEquipment
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Опубликовано или отправлено на проверку
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipment" }
        "422":
          description: Карточка заполнена не полностью
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationProblem" }

  /equipment/{id}/archive:
    post:
      tags: [catalog]
      summary: Снять технику с площадки
      operationId: archiveEquipment
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Снято
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipment" }

  /media/uploads:
    post:
      tags: [media]
      summary: Временные ссылки на загрузку файлов (ADR-5)
      description: >
        Клиент грузит файл прямо в хранилище по временной ссылке, минуя наш
        бэкенд: фотографии весят мегабайты. Принимаем JPEG, PNG, WebP, HEIC и
        PDF; имя файла придумывает сервер.
      operationId: createUploadLinks
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType]
              properties:
                contentType: { type: string, example: image/jpeg }
                folder: { type: string, enum: [equipment, jobs, docs, misc] }
                count: { type: integer, minimum: 1, maximum: 8, default: 1 }
      responses:
        "200":
          description: Ссылки на загрузку
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UploadLink" }
        "415": { $ref: "#/components/responses/Problem" }

  /users/{userId}:
    get:
      tags: [identity]
      summary: Публичная карточка человека (ТЗ §2.3)
      description: >
        Имя, город и отметка проверки. Открыта без входа: ссылкой на исполнителя
        делятся в мессенджере. Телефон здесь не отдаётся никогда — до сделки он
        скрыт, а в сделке приходит отдельно.
      operationId: publicProfile
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Карточка
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  city: { type: string }
                  verified: { type: boolean }
                  createdAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Problem" }

  /equipment/users/{userId}:
    get:
      tags: [catalog]
      summary: Техника человека в его карточке
      description: >
        Только опубликованные машины. Тарифы и документы посторонним не видны.
      operationId: publicEquipment
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Техника
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Equipment" }

  /realtime/token:
    get:
      tags: [gateway]
      summary: Билет на подключение к живым обновлениям (ADR-6)
      description: >
        Короткоживущий токен для Centrifugo: по нему клиент подписывается на
        канал торга (job:{id}) и переписки (chat:{id}). Живёт час — клиент
        переподключается сам, а короткий срок ограничивает ущерб от утечки.
      operationId: realtimeToken
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Билет
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Problem" }
        "503":
          description: Живые обновления выключены на этом стенде

  /crm/business:
    get:
      tags: [orders]
      summary: Сводка «Мой бизнес» исполнителя (ТЗ §3.1)
      description: >
        Доход за период с изменением к прошлому такому же отрезку, воронка
        (отклики → выбрали → завершил) и клиентская база. Всё считается из
        завершённых сделок — человек ничего не заполняет руками.
      operationId: businessSummary
      security: [{ bearerAuth: [] }]
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, quarter, year, all]
            default: month
      responses:
        "200":
          description: Сводка
          content:
            application/json:
              schema:
                type: object
                properties:
                  period: { type: string }
                  income: { type: integer, format: int64 }
                  deals: { type: integer }
                  average: { type: integer, format: int64 }
                  currency: { type: string }
                  prevIncome: { type: integer, format: int64 }
                  delta: { type: integer, description: "изменение дохода, %" }
                  deltaComparable:
                    type: boolean
                    description: "с нулевым прошлым доходом процент не считается"
                  funnel:
                    type: object
                    properties:
                      offers: { type: integer }
                      won: { type: integer }
                      completed: { type: integer }
                      winRate: { type: number }
                      finishRate: { type: number }
                  clients:
                    type: array
                    items:
                      type: object
                      properties:
                        userId: { type: string, format: uuid }
                        name: { type: string }
                        deals: { type: integer }
                        total: { type: integer, format: int64 }
                        last: { type: string, format: date-time }
                        regular: { type: boolean, description: "три сделки и больше" }

  /moderation/equipment:
    get:
      tags: [catalog]
      summary: Очередь проверки техники (ТЗ §4.1)
      description: >
        Доступно роли moderator или admin. Сортировка по возрасту: первым
        разбирается то, что ждёт дольше всех — исполнителю обещали ответ за
        сутки. В карточке видны документы, которых нет в обычной выдаче.
      operationId: moderationQueue
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200":
          description: Очередь
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        ownerId: { type: string, format: uuid }
                        title: { type: string }
                        year: { type: integer }
                        photos: { type: array, items: { type: string } }
                        docs:
                          type: array
                          items: { type: string }
                          description: "видно только модерации"
                        waitingHours: { type: integer }
        "403": { $ref: "#/components/responses/Problem" }

  /moderation/equipment/{id}/approve:
    post:
      tags: [catalog]
      summary: Одобрить технику — бейдж «Проверен»
      operationId: approveEquipment
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Одобрено, владельцу ушло уведомление
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipment" }
        "403": { $ref: "#/components/responses/Problem" }
        "409":
          description: Карточка не ждёт проверки

  /moderation/equipment/{id}/reject:
    post:
      tags: [catalog]
      summary: Отклонить технику с обязательной причиной
      description: >
        Причина обязательна: «отклонено» без объяснения человек не сможет
        исправить, и он просто уйдёт с площадки. Текст уходит владельцу.
      operationId: rejectEquipment
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        "200":
          description: Отклонено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipment" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /crm/calendar:
    get:
      tags: [orders]
      summary: Календарь занятости исполнителя (ТЗ §3.1)
      description: >
        Дни с подтверждёнными сделками и собственные отметки «не работаю» в
        одном списке. День со сделкой сильнее своей пометки: работу уже
        подтвердили.
      operationId: calendar
      security: [{ bearerAuth: [] }]
      parameters:
        - name: month
          in: query
          schema: { type: string, example: "2026-08" }
      responses:
        "200":
          description: Занятость месяца
          content:
            application/json:
              schema:
                type: object
                properties:
                  month: { type: string }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BusyDay" }
    post:
      tags: [orders]
      summary: Отметить день «не работаю»
      description: >
        Отпуск, ремонт техники, занятость на стороне. Такие дни учитываются при
        ставке: без них человек получает работу на даты, в которые не выйдет.
      operationId: markBusy
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [day]
              properties:
                day: { type: string, example: "2026-08-20" }
                note: { type: string, example: "ремонт техники" }
      responses:
        "200":
          description: Отмечено

  /crm/calendar/{day}:
    delete:
      tags: [orders]
      summary: Снять свою отметку с дня
      description: >
        Дни со сделками так не снимаются: их занятость определяется работой.
      operationId: unmarkBusy
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: day, in: path, required: true, schema: { type: string, example: "2026-08-20" } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Отметка снята

  /crm/export:
    get:
      tags: [orders]
      summary: Выгрузка сделок за период (ТЗ §3.1 п.7, §3.2 п.6)
      description: >
        Таблица со сделками для бухгалтерии и налоговой: дата, задание, вторая
        сторона, сумма, статус. Формат — CSV с точкой с запятой и меткой
        кодировки: Excel открывает такой файл двойным щелчком и не ломает
        кириллицу.
      operationId: exportDeals
      security: [{ bearerAuth: [] }]
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [week, month, quarter, year, all], default: year }
        - name: role
          in: query
          description: "owner — доходы исполнителя, client — расходы заказчика"
          schema: { type: string, enum: [owner, client], default: owner }
      responses:
        "200":
          description: Файл отчёта
          content:
            text/csv:
              schema: { type: string }

  /deals/{dealId}/dispute:
    post:
      tags: [orders]
      summary: Открыть спор по сделке (ТЗ §4.1)
      description: >
        Спор открывает участник сделки и только по начатой работе: до выезда
        исполнителя сделку просто отменяют. Описание проблемы обязательно —
        по слову «плохо» разобрать нечего. На время разбора оценки заморожены.
      operationId: openDispute
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: dealId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 20, maxLength: 1000 }
                photos: { type: array, items: { type: string } }
      responses:
        "201":
          description: Спор открыт
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      tags: [orders]
      summary: Спор по сделке (для её участников)
      operationId: dealDispute
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: dealId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Спор
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
        "404": { $ref: "#/components/responses/Problem" }

  /moderation/disputes:
    get:
      tags: [orders]
      summary: Очередь разбора споров (ТЗ §4.1)
      description: Доступно роли moderator или admin. Старые сверху.
      operationId: disputeQueue
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200":
          description: Очередь
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Dispute" }
        "403": { $ref: "#/components/responses/Problem" }

  /moderation/disputes/{id}/resolve:
    post:
      tags: [orders]
      summary: Решение по спору с обоснованием
      description: >
        Исход и обоснование обязательны: решение без объяснения обе стороны
        считают несправедливым. Текст уходит обоим. В пользу заказчика сделка
        отменяется, в пользу исполнителя и при компромиссе — закрывается как
        выполненная.
      operationId: resolveDispute
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, resolution]
              properties:
                outcome: { type: string, enum: [client, owner, compromise] }
                resolution: { type: string, minLength: 20, maxLength: 1000 }
      responses:
        "200":
          description: Спор разобран
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: Гарантия «двойной тап ≠ две операции» (ТЗ §4.3).
  responses:
    Problem:
      description: Ошибка (RFC 9457 problem+json) с человекочитаемым detail для тоста
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Превышен лимит запросов
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    NotificationPrefs:
      type: object
      properties:
        auctions: { type: boolean }
        deals: { type: boolean }
        chat: { type: boolean }
        newJobs: { type: boolean }
        marketing: { type: boolean, description: "рассылка — только по согласию" }
        quietHours: { type: boolean }
        quietFrom: { type: integer, minimum: 0, maximum: 23, example: 22 }
        quietTo: { type: integer, minimum: 0, maximum: 23, example: 8 }
        outbidAlways:
          type: boolean
          description: "будить ночью, если перебили ставку"
    AppNotification:
      type: object
      required: [id, title, kind]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          description: "тип события из push-матрицы"
          enum: [offer, auction, deal, message, review, job, system]
        title: { type: string }
        body: { type: string }
        data:
          type: object
          additionalProperties: { type: string }
          description: "route — куда вести по нажатию, плюс данные экрана"
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
    Dispute:
      type: object
      properties:
        id: { type: string, format: uuid }
        dealId: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        jobTitle: { type: string }
        reason: { type: string }
        photos: { type: array, items: { type: string } }
        status: { type: string, enum: [open, resolved] }
        outcome: { type: string, enum: [client, owner, compromise] }
        resolution: { type: string, description: "обоснование, видят обе стороны" }
        openedByClient: { type: boolean }
        clientName: { type: string }
        ownerName: { type: string }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
    BusyDay:
      type: object
      properties:
        day: { type: string, example: "2026-08-20" }
        source:
          type: string
          enum: [deal, manual]
          description: "deal — занят сделкой, manual — отметил сам"
        note: { type: string }
        dealId: { type: string, format: uuid }
        title: { type: string }
    Equipment:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        categoryName: { $ref: "#/components/schemas/LocalizedName" }
        brand: { type: string, example: JCB }
        model: { type: string, example: 3CX }
        year: { type: integer, minimum: 1980 }
        specs:
          type: object
          additionalProperties: true
          description: "значения по specTemplate категории"
        priceHour: { type: integer, format: int64 }
        priceShift: { type: integer, format: int64 }
        priceDay: { type: integer, format: int64 }
        minHours: { type: integer }
        delivery: { type: integer, format: int64 }
        crewSize: { type: integer, description: "бригада рабочих с техникой" }
        crewPrice: { type: integer, format: int64 }
        photos:
          type: array
          items: { type: string }
          maxItems: 8
        status:
          type: string
          enum: [draft, pending, verified, unverified, rejected, archived]
        rejectReason: { type: string }
        draftStep: { type: integer, minimum: 1, maximum: 4 }
        wins: { type: integer, description: "выиграно работ этой машиной" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UploadLink:
      type: object
      properties:
        key: { type: string }
        uploadUrl: { type: string, description: "временная ссылка для PUT" }
        publicUrl: { type: string, description: "постоянный адрес файла" }
        expiresIn: { type: integer, example: 900 }
    Review:
      type: object
      required: [id, stars]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        stars: { type: integer, minimum: 1, maximum: 5 }
        tags:
          type: array
          items: { type: string }
        text: { type: string }
        authorName: { type: string }
        replyText: { type: string, description: "ответ того, о ком отзыв" }
        replyAt: { type: string, format: date-time }
        publishedAt:
          type: string
          format: date-time
          description: "пусто, пока отзыв ждёт вторую сторону"
        createdAt: { type: string, format: date-time }
    Chat:
      type: object
      required: [id, jobId, kind]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        jobTitle: { type: string }
        peerName: { type: string, description: "имя собеседника для списка" }
        kind:
          type: string
          enum: [pre_deal, deal]
          description: "до сделки контакты маскируются, в сделке — нет"
        lastText: { type: string }
        lastMessageAt: { type: string, format: date-time }
        unread: { type: integer, description: "непрочитанных для запросившего" }
        createdAt: { type: string, format: date-time }
    Message:
      type: object
      required: [id, chatId, kind, text, createdAt]
      properties:
        id: { type: string, format: uuid }
        chatId: { type: string, format: uuid }
        senderId:
          type: string
          format: uuid
          description: "пусто у системных сообщений площадки"
        kind:
          type: string
          enum: [text, photo, system]
        text: { type: string }
        createdAt: { type: string, format: date-time }
    Bid:
      type: object
      required: [id, price, status]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        price: { type: integer, format: int64 }
        currency: { type: string, default: AMD }
        comment: { type: string }
        status:
          type: string
          enum: [active, withdrawn, outbid, won, lost, expired]
        rank: { type: integer, description: "место по цене, 1 — лучшая" }
        mine: { type: boolean, description: "это ставка запрашивающего" }
        score: { type: number, description: "оценка скоринга, появляется после финиша" }
        createdAt: { type: string, format: date-time }
    DealEvent:
      type: object
      required: [status, at]
      properties:
        status: { type: string }
        at: { type: string, format: date-time }
        byId: { type: string, format: uuid }
        note: { type: string }
    Deal:
      type: object
      required: [id, jobId, clientId, ownerId, price, status]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        offerId: { type: string, format: uuid, nullable: true }
        clientId: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        price: { type: integer, format: int64, description: "зафиксирована при создании сделки" }
        currency: { type: string, default: AMD }
        status:
          type: string
          enum: [confirmed, on_the_way, in_progress, work_done, completed, disputed, cancelled]
        timeline:
          type: array
          items: { $ref: "#/components/schemas/DealEvent" }
        acceptanceDeadline:
          type: string
          format: date-time
          nullable: true
          description: "48 часов на приёмку, дальше автоприёмка"
        cancelReason: { type: string }
        cancelledBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
    OfferInput:
      type: object
      required: [kind, price]
      properties:
        kind:
          type: string
          enum: [accept, counter]
          description: accept — согласен с ценой задания, counter — своя цена
        price: { type: integer, format: int64 }
        comment: { type: string, maxLength: 200 }
        eta: { type: string, description: "когда сможет приступить, свободный текст" }
        unitId: { type: string, format: uuid, nullable: true }
    Offer:
      type: object
      required: [id, jobId, ownerId, kind, price, status]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        kind: { type: string, enum: [accept, counter] }
        price: { type: integer, format: int64 }
        currency: { type: string, default: AMD }
        comment: { type: string }
        eta: { type: string }
        unitId: { type: string, format: uuid, nullable: true }
        status:
          type: string
          enum: [active, withdrawn, declined, accepted, counter_offered]
        declineReason: { type: string }
        clientCounterPrice: { type: integer, format: int64, nullable: true }
        clientCounterAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Category:
      type: object
      required: [id, kind, slug, name, icon, specTemplate]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: string, format: uuid, nullable: true }
        kind: { type: string, enum: [work, unit] }
        slug: { type: string, example: work-earth }
        name: { $ref: "#/components/schemas/LocalizedName" }
        icon: { type: string, description: "Имя иконки Phosphor из design_system (эмодзи запрещены)" }
        specTemplate:
          type: array
          items: { $ref: "#/components/schemas/SpecField" }
        sortOrder: { type: integer }
        children:
          type: array
          items: { $ref: "#/components/schemas/Category" }
    LocalizedName:
      type: object
      required: [hy, ru, en]
      properties:
        hy: { type: string }
        ru: { type: string }
        en: { type: string }
    SpecField:
      type: object
      required: [key, type]
      description: Поле характеристик — из него клиент строит поле формы.
      properties:
        key: { type: string, example: bucket }
        type: { type: string, enum: [number, text, select, bool] }
        unit: { type: string, example: "м³" }
        min: { type: number }
        max: { type: number }
        options:
          type: array
          items: { type: string }
        label_hy: { type: string }
        label_ru: { type: string }
        label_en: { type: string }
        required: { type: boolean }
    Geo:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double, example: 40.1872 }
        lng: { type: number, format: double, example: 44.5152 }
    Auction:
      type: object
      properties:
        durationH: { type: integer, example: 24, description: "1 час … 7 суток" }
        endsAt: { type: string, format: date-time, description: "Считает сервер при публикации" }
        reserveAmount: { type: integer, format: int64, nullable: true, description: "Минимальная цена. Видна только заказчику" }
        autoExtend: { type: boolean, default: true, description: "+10 мин при ставке в последние 5 минут" }
        decisionWindowH: { type: integer, default: 12 }
    JobStatus:
      type: string
      enum: [draft, published, collecting_offers, bidding, deal_pending, deciding,
             confirmed, in_progress, work_done, completed, disputed, cancelled,
             declined_all, expired, expired_no_bids]
    JobDraft:
      type: object
      description: Поля визарда. Отсутствующее поле не изменяется.
      properties:
        orderType: { type: string, enum: [job, rental, transport, workers] }
        categoryId: { type: string, format: uuid, nullable: true }
        openToAny: { type: boolean, description: "«Опишу задачу — пусть исполнители предложат технику»" }
        title: { type: string, maxLength: 80 }
        description: { type: string, minLength: 20 }
        params:
          type: object
          additionalProperties: true
          description: Значения по specTemplate категории
        photos:
          type: array
          maxItems: 6
          items: { type: string, format: uri }
        geo: { $ref: "#/components/schemas/Geo" }
        address: { type: string }
        access: { type: string, enum: ["yes", "no", "unknown"] }
        dateMode: { type: string, enum: [asap, range, exact] }
        dateStart: { type: string, format: date-time }
        dateEnd: { type: string, format: date-time }
        budgetAmount: { type: integer, format: int64, example: 120000 }
        currency: { type: string, default: AMD }
        mode: { type: string, enum: [fixed, auction] }
        auction: { $ref: "#/components/schemas/Auction" }
        workersCount: { type: integer, minimum: 0, description: "Разнорабочие в дополнение к технике (§5.5)" }
        draftStep: { type: integer, minimum: 1, maximum: 5 }
    Job:
      allOf:
        - $ref: "#/components/schemas/JobDraft"
        - type: object
          required: [id, clientId, status, currency, mode]
          properties:
            id: { type: string, format: uuid }
            clientId: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/JobStatus" }
            viewsCount: { type: integer }
            offersCount: { type: integer }
            winnerBidId: { type: string, format: uuid, nullable: true }
            distanceM: { type: number, format: double, nullable: true, description: "Только в ленте, при переданных lat/lng" }
            publishedAt: { type: string, format: date-time, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            fields:
              type: object
              additionalProperties: { type: string }
              description: "поле → что именно не так; экран подсвечивает их"
    Role:
      type: string
      enum: [client, owner]
    DeviceRegistration:
      type: object
      required: [token, platform]
      properties:
        token: { type: string, description: "Регистрационный токен FCM устройства" }
        platform:
          type: string
          enum: [android, ios, web]
        locale:
          type: string
          enum: [hy, ru, en]
          description: "Язык для текста пуша"
        appVersion: { type: string }
    Session:
      type: object
      required: [accessToken, refreshToken, expiresInSec, user]
      properties:
        accessToken: { type: string, description: "JWT ES256, 15 мин" }
        refreshToken: { type: string, description: "rotating, 30 дней" }
        expiresInSec: { type: integer, example: 900 }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      required: [id, phone, roles, activeRole]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string, description: "виден только владельцу; другим — до сделки скрыт" }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
        city: { type: string, nullable: true }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        activeRole: { $ref: "#/components/schemas/Role" }
        rating: { type: number, example: 4.8 }
        ratingCount: { type: integer, example: 36 }
        verified: { type: boolean }
        createdAt: { type: string, format: date-time }
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: "человекочитаемо, годится в тост" }
