name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [identity, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Проверки (формат · vet · тесты)
        working-directory: services/${{ matrix.service }}
        run: |
          test -z "$(gofmt -l .)" || (echo "Не отформатировано:"; gofmt -l .; exit 1)
          go vet ./...
          go test ./...

  flutter:
    name: Flutter · analyze · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: design_system — анализ и тесты
        working-directory: packages/design_system
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: api_client — анализ
        working-directory: packages/api_client
        run: |
          dart pub get
          dart analyze
      - name: mobile — анализ
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter gen-l10n
          flutter analyze
