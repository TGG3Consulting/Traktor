name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [identity, gateway, notifications]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: Проверки (формат · зависимости · vet · тесты)
        working-directory: services/${{ matrix.service }}
        run: |
          test -z "$(gofmt -l .)" || (echo "Не отформатировано:"; gofmt -l .; exit 1)
          go mod verify
          go build ./...
          go vet ./...
          go test -race ./...
      - name: go.mod и go.sum не расходятся с кодом
        working-directory: services/${{ matrix.service }}
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || (echo "go.mod/go.sum устарели — выполните go mod tidy и закоммитьте"; exit 1)

  flutter:
    name: Flutter · analyze · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: design_system — анализ и тесты
        working-directory: packages/design_system
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: api_client — анализ
        working-directory: packages/api_client
        run: |
          dart pub get
          dart analyze
      - name: mobile — анализ
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter gen-l10n
          flutter analyze
