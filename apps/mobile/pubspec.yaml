name: traktor_mobile
description: Traktor — клиентское приложение (заказчик и исполнитель), iOS + Android + Web.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  design_system:
    path: ../../packages/design_system
  api_client:
    path: ../../packages/api_client
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true # включает gen-l10n по l10n.yaml
