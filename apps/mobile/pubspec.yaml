name: traktor_mobile
description: Traktor — клиентское приложение (заказчик и исполнитель), iOS + Android + Web.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Адреса без решётки в вебе: часть после # на сервер не уходит, и превью
  # ссылки в мессенджере собрать не из чего (ТЗ §4.2).
  flutter_web_plugins:
    sdk: flutter
  intl: any
  design_system:
    path: ../../packages/design_system
  api_client:
    path: ../../packages/api_client
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  # Выбор фотографий техники и заданий (ТЗ §2.5): работает и на телефоне,
  # и в вебе, поэтому отдельной реализации под каждую платформу не нужно.
  image_picker: ^1.1.2
  # Живые обновления торга и переписки (ADR-6). Берём тонкий вебсокет и
  # говорим с Centrifugo его же JSON-протоколом: официальный клиент тянет
  # зависимости, которые в вебе не собираются.
  web_socket_channel: ^3.0.1

dev_dependencies:
  http: ^1.2.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true # включает gen-l10n по l10n.yaml
